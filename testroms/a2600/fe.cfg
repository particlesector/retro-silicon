# One 4 KB bank of an FE cartridge, at ORG ($F000 for bank 0, $D000 for bank 1: ld65 -D ORG=n), its
# ID at ORG + $E00 and the vectors at its end.
MEMORY { ROM: start = ORG, size = $1000, fill = yes, fillval = $FF; }
SEGMENTS {
    CODE:    load = ROM, type = ro;
    ID:      load = ROM, type = ro, start = ORG + $E00;
    VECTORS: load = ROM, type = ro, start = ORG + $FFC;
}
