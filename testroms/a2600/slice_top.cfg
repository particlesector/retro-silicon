# A sliced cartridge's fixed top slice, SIZE bytes ending at $FFFF (ld65 -D SIZE=n -D TOP=start), its
# vectors at its end.
MEMORY { ROM: start = TOP, size = SIZE, fill = yes, fillval = $FF; }
SEGMENTS {
    CODE:    load = ROM, type = ro;
    VECTORS: load = ROM, type = ro, start = $FFFC;
}
