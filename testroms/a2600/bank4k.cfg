# One 4 KB bank of a banked cartridge at $F000: its ID at $FE00, the bytes at the hotspots at
# $FFF0-$FFFB, the reset and IRQ vectors at its end.
MEMORY { ROM: start = $F000, size = $1000, fill = yes, fillval = $FF; }
SEGMENTS {
    CODE:    load = ROM, type = ro;
    ID:      load = ROM, type = ro, start = $FE00;
    MARKS:   load = ROM, type = ro, start = $FFF0;
    VECTORS: load = ROM, type = ro, start = $FFFC;
}
