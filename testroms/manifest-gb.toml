# SPDX-License-Identifier: Apache-2.0
# The Game Boy's test ROMs, its boot ROMs and the SM83's per-instruction tests.
# fetch.py downloads or builds them into a cache and checks them against these
# SHA-256 sums; they're never committed here.
#
# model: the console the ROM runs on, dmg (the Game Boy) or cgb (the Game Boy
# Color); it powers up through that model's boot ROM.
# needs: the parts of the console the ROM exercises. "cart ram" is cartridge
# RAM at $A000 and no more: blargg's newer ROMs are MBC1 cartridges of 32 KB
# that use the MBC1 only to reach the RAM their results go in, so they need
# the RAM, not the MBC1's banking, which Mooneye's mbc1 tests probe.
# check = "serial": blargg's: text over the serial port, ending in "Passed"
# or "Failed".
# check = "blargg": blargg's newer ROMs: $80 at cartridge RAM $A000 while
# running, then the result (0 a pass), valid once $A001-$A003 hold DE B0 61;
# the text report from $A004.
# check = "mooneye": Mooneye's: the bytes 3 5 8 13 21 34 over the serial port
# for a pass (and in B C D E H L at an LD B,B), $42 six times for a failure.
# check = "frame": no result of its own; the core's frame `frames` must match
# MesenCE's (tools/mesen/gb_frames.py).
# frames: for a check with a result, the frame it finishes on in MesenCE
# (frames ended since power-up, the boot ROM's included); allow at least twice
# that. gb_frames.py records the frame 30 after it.
# again: run the ROM twice, the second time from the battery RAM the first
# left (a cartridge with a battery); its cartridge RAM at the end must be
# MesenCE's (the golden list's savcrc). sav = { path, sha256 }: a file of
# battery RAM to power up with, under the same source.
# input: an input script, "frame:keys, ...": the buttons held from that frame
# on (frames ended since power-up), as gb_sys's `keys` byte (bit 7 Start,
# Select, B, A, Down, Up, Left, bit 0 Right: A is 16, Down 8), 0 none.

[sources.blargg-gb]
# blargg's Game Boy tests, as built by blargg, in a copy on GitHub (his site
# is gone).
url = "https://raw.githubusercontent.com/retrio/gb-test-roms/c240dd7d700e5c0b00a7bbba52b53e4ee67b5f15/"

[sources.mooneye]
# Gekkio's Mooneye test suite (MIT), as Gekkio builds it from commit 31510e1.
archive = "https://gekkio.fi/files/mooneye-test-suite/mts-20260714-0944-31510e1/mts-20260714-0944-31510e1.tar.xz"
sha256 = "6d4fdda2f1d8d2f5f51b0ff3f6f3cc2fbae047aa395a39c82bda3a0e7cbd2641"
strip = 1

[sources.dmg-acid2]
# Matt Currie's dmg-acid2 (MIT).
url = "https://github.com/mattcurrie/dmg-acid2/releases/download/v1.0/"

[sources.cgb-acid2]
# Matt Currie's cgb-acid2 (MIT).
url = "https://github.com/mattcurrie/cgb-acid2/releases/download/v1.1/"

[sources.gb-roms]
# retro-silicon's own test ROMs (testroms/gb, Apache-2.0), for behaviour no public test covers,
# each from a game that showed it; built with rgbds 1.0.4 (testroms/gb's README).
dir = "gb"
license = "Apache-2.0"
credit = "retro-silicon"
build = ["make"]

[sources.mealybug]
# Matt Currie's Mealybug Tearoom tests (MIT): the PPU's registers written during mode 3, each with
# the hardware's frame (photos of a DMG-blob, a CPU CGB C and a CPU CGB D, as images of the
# screen's values) in its repository's `expected` folder; tools/gb/mealybug.py turns them into
# frame CRCs. The ROMs are its zip, at this commit.
archive = "https://raw.githubusercontent.com/mattcurrie/mealybug-tearoom-tests/70e88fb90b59d19dfbb9c3ac36c64105202bb1f4/mealybug-tearoom-tests.zip"
sha256 = "e2fa6ca96ad48bd64d7297fda042db04c15117a730da3bbd590f139e89b150bd"

[sources.rtc3test]
# aaaaaa123456789's rtc3test (the Unlicense): MBC3's real-time clock, in three suites picked from a
# menu (tests.md in its repository describes them).
url = "https://github.com/aaaaaa123456789/rtc3test/releases/download/v004/"

[sources.sameboy]
# SameBoy 1.0.5 (Lior Halphon, Expat): its open-source boot ROMs, built from
# source. Needs rgbds 1.0.4 (another version may build other bytes) and a C
# compiler, for the logo's compressor.
git = "https://github.com/LIJI32/SameBoy"
commit = "ea667ad79aa28409f034b1fd6da7304e1844750d"
build = ["make", "bootroms", "CONF=release"]

[sources.sm83]
# SingleStepTests' SM83 tests (MIT): 1,000 cases for each opcode, each its
# registers and memory before and after and its bus in every machine cycle.
git = "https://github.com/SingleStepTests/sm83"
commit = "f9c30210245dd691661db39f5ace022c465ecc2f"

