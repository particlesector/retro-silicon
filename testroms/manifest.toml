# SPDX-License-Identifier: Apache-2.0
# Test ROMs the cores are checked against. They're fetched by fetch.py into a
# cache and checked against these SHA-256 sums; they're never committed here.
#
# check = "blargg": the ROM writes its result to $6000 (0x80 while running,
# then 0 for a pass or an error code), DE B0 61 at $6001-$6003 once the result
# is valid, and a text report from $6004. `frames` is roughly when it finishes
# in MesenCE; allow at least twice that.
# check = "trace": compare a CPU trace against the reference log.
# needs: the parts of the console the ROM exercises.

[sources.nes-test-roms]
url = "https://raw.githubusercontent.com/christopherpow/nes-test-roms/95d8f621ae55cee0d09b91519a8989ae0e64753b/"

[[rom]]
id = "nestest"
source = "nes-test-roms"
path = "other/nestest.nes"
sha256 = "f67d55fd6b3cf0bad1cc85f1df0d739c65b53e79cecb7fea8f77ec0eadab0004"
needs = "cpu"
covers = "Every official and unofficial opcode; run from $C000 for the automated mode"
check = "trace"
trace = { path = "other/nestest.log", sha256 = "442c4dd5539c7e88b3fd73c7b732a7eadbd22b47c2cd9e58397ef147f64f6f8f" }

