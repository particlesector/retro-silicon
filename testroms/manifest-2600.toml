# SPDX-License-Identifier: Apache-2.0
# Test cartridges for the Atari 2600, fetched or built by fetch.py and checked
# against these SHA-256 sums; the built files are never committed.
#
# The 2600 has no public test suite like the NES's, so these are our own,
# in testroms/a2600 (ca65 and ld65 from cc65, GNU Make), each drawing what it
# finds as background colours (show.inc), so the frame is the result.
# check = "frame": the core's frame `frames` must match Stella's
# (tools/stella/frames.py: 160 x 228 TIA colour values from the 23rd line
# after VSYNC ends). stella: what that frame shows in Stella, so the
# expected result is on record.
# needs: the parts of the console the cartridge exercises.
# golden_crc: the right frame where Stella's differs (stella_crc, checked),
# from golden_from. score_glitch_crc: the frame with video/tia's
# SCORE_GLITCH on, where it differs, from score_glitch_from (Stella's
# dev.tia.pfscoreglitch setting draws it); frames.py writes those to
# harness/golden/a2600_score_glitch_crc32.txt. audio_samples: the core's sound
# must match Stella's first N samples too (harness/golden/a2600_audio_crc32.txt).
# paddles: INPT0-3's knobs (0-255, a pot of n / 256 Mohm) or "-" for none, as Stella plugs them
# in (harness/golden/a2600_paddles.txt); a cartridge without has none.

[sources.a2600-carts]
dir = "a2600"
build = ["make"]
license = "Apache-2.0"
credit = "retro-silicon"

[[rom]]
id = "tia_colours"
source = "a2600-carts"
path = "tia_colours.bin"
sha256 = "ad0f6b54233d51a30bc802c892ec28134df4cb16ed4ff82e714b480ffc5f1ca6"
needs = "cpu, tia"
covers = "Every NTSC colour, 16 hues in 8 luminances, one per picture line"
check = "frame"
frames = 30
stella = "Lines 0-127 each one colour, 2x for line x: all 128 distinct; lines 128-191 repeat the first 64"

[[rom]]
id = "riot_ram"
source = "a2600-carts"
path = "riot_ram.bin"
sha256 = "835cb2f402d609370674b077713981a8605df80a362728198d4a600d8b318317"
needs = "cpu, riot, tia"
covers = "The RIOT's RAM through $80, $180, $480 and $D80, and the stack at $1FF"
check = "frame"
frames = 30
stella = "Results 00 00 00 00 00 a5 a5 ff, then 0: no errors through any mirror"

[[rom]]
id = "riot_timer"
source = "a2600-carts"
path = "riot_timer.bin"
sha256 = "f81c8e66d4da94b8c9e33b92fda52a87e2a27911b911f4b93f027aabb7b29b77"
needs = "cpu, riot, tia"
covers = "The RIOT's timer at each divider: count down, underflow, one a clock after it, the divider restored by reading INTIM, TIMINT's flag"
check = "frame"
frames = 30
stella = "Results ff f8 f1 ea e3 dc d5 ce, 01 00 fe fd fd fc fb fa, fc fc fc fc, fc fc fc fc, 80 f6 00 e8 00 da 00 cc"

[[rom]]
id = "tia_playfield"
source = "a2600-carts"
path = "tia_playfield.bin"
sha256 = "3dfde0c9f1e6e91d0e1225cb0415d7d179e5f39c165bd8d6271f82e9adede4a7"
needs = "cpu, tia"
covers = "The playfield (normal, reflected, score, score with priority), the background and VBLANK, and the colour clock each write to PF2, COLUBK, VBLANK and CTRLPF lands on"
check = "frame"
frames = 30
stella = "Four playfield bands (yellow, reflected on blue, score red and green, pink), then four staircases, one step a cycle: PF2, the background, VBLANK and the reflection switching on a cycle later each line"
score_glitch_crc = "0x7dd31b8d"
score_glitch_from = "Stella 7.0 with dev.tia.pfscoreglitch: band 3's column 79 in COLUP1; the 10444D die's netlist agrees"

[[rom]]
id = "tia_players"
source = "a2600-carts"
path = "tia_players.bin"
sha256 = "719dee61c8584879208489863df078afe39fc7553d844d7de421ab21971e05e2"
needs = "cpu, tia"
covers = "The players: every NUSIZ (copies, double and quad width), RESP landing a cycle later each line from the blank to the middle of the picture, reflection, and vertical delay"
check = "frame"
frames = 30
stella = "Eight bands, one per NUSIZ: player 1 (blue) in that band's copies and width; player 0 (red, reflected in odd bands) stepping right a cycle each line"

[[rom]]
id = "tia_missiles_ball"
source = "a2600-carts"
path = "tia_missiles_ball.bin"
sha256 = "958e805d35b3e8daddeb55b70904ac060a39666d8b1dcc120018ddda1be411d0"
needs = "cpu, tia"
covers = "The missiles and ball: every missile and ball width, the missiles' copies, RESM and RESBL landing a cycle later each line from the blank to the middle of the picture (during a missile's draw too), RESMP, the ball's vertical delay, and priority against the players and playfield in each CTRLPF mode"
check = "frame"
frames = 30
stella = "Eight bands over a green playfield: missile 0 (red) and the ball (green) stepping right 3 pixels a line, missile 1 (blue) in that band's copies, red playfield in the score bands, the ball missing in bands 5 and 7"
stella_crc = "0x9fc8d93d"
golden_crc = "0xd496459a"
golden_from = "Gopher2600 0.57.2's frame: band 2's brief RESMP1 leaves missile 1 where it was (the TIA's die, from its netlist, agrees), where Stella moves it onto player 1"
score_glitch_crc = "0xb4ab7d4e"
score_glitch_from = "golden_crc's frame with column 79 of the score bands as Stella 7.0 draws it with dev.tia.pfscoreglitch (72 pixels, none of them RESMP's); the 10444D die's netlist agrees on them"

[[rom]]
id = "tia_hmove"
source = "a2600-carts"
path = "tia_hmove.bin"
sha256 = "55e5fa413fa8c54d61637557abe2a0db09a9362752b918b6df5bfa3e106c268a"
needs = "cpu, tia"
covers = "HMOVE: all 16 HM values on every object, HMOVE written at each cycle from the line's start to its end (the comb, movement during the picture, Stella's starfield widths for the missiles and ball, movement running on into the next line), and HMCLR during a movement"
check = "frame"
frames = 30
stella = "Eight bands of the five objects drifting and smearing: an 8-pixel black comb on the left of bands 0-2, 6 and 7; tall columns in bands 3-5 where the late HMOVEs leave objects nearly still"

[[rom]]
id = "tia_collisions"
source = "a2600-carts"
path = "tia_collisions.bin"
sha256 = "a4f7324da345853d4713d8bc5f3f7dd7ac93c9507b7e3720473decfb1f49ba9c"
needs = "cpu, tia"
covers = "The collision latches and CXCLR (every pair; a chosen few; and collisions caught only in the horizontal blank by HMOVE's movement steps), INPT0-INPT5, and the fire buttons' latch"
check = "frame"
frames = 30
stella = "Results (show.inc): 0-7 $C0 but $80 at 6; 8-15 00 80 80 C0 00 00 80 00; 16-23 0 but $80 at 23; 24-31 08 08 08 08 88 88 8C 8D"

[[rom]]
id = "tia_rsync"
source = "a2600-carts"
path = "tia_rsync.bin"
sha256 = "8116510559b4c0253ab94fb530183467c058a837f21444f616a61222fda1962c"
needs = "cpu, tia"
covers = "RSYNC written at every cycle of the line, from the blank to the line's last colour clock: the cut line's last 3 colour clocks, its black end, and the objects' positions after the missed ticks; frames of 351 lines, so Stella's frame manager ends some (frame 30 among them) by its line count, without VSYNC"
check = "frame"
frames = 30
stella = "Over a green and grey striped playfield, every third line cut short: whole black lines in the first three bands, then a black wedge growing from the right as the cut comes later; the red and blue objects jump right after each cut"

[[rom]]
id = "tia_resmp"
source = "a2600-carts"
path = "tia_resmp.bin"
sha256 = "d44b49596fc60cff0618e25d32374f2dec0a05e688c8d31ee1de9aa2552625b8"
needs = "cpu, tia"
covers = "RESMP held for 15 colour clocks at each cycle across player 1's main copy, at each width and with two copies: a missile moves to its player only if RESMP is set as the main copy passes its sixth pixel (double width: its fourth pixel's second half; quad: the third's last quarter)"
check = "frame"
frames = 30
stella = "Eight bands of a blue player at the left; missile 1 back on the right except after the windows that move it, Stella moving it after every window"
stella_crc = "0x4153eb84"
golden_crc = "0x0f5e4ecd"
golden_from = "Gopher2600 0.57.2's frame, in which the missile moves only after the windows covering the reset point, and Stella's after every window; the TIA's transistor-level netlist moves it after the same windows, give or take the one at each end of the range, where it lands writes a colour clock earlier than both emulators"

[[rom]]
id = "tia_audio"
source = "a2600-carts"
path = "tia_audio.bin"
sha256 = "24702074171f29ea51296ac59ca31fe1ba55b4eb09eb5f6bdfc874bccb5ae93b"
needs = "cpu, tia"
covers = "The TIA's sound: every AUDC mode at several AUDF and AUDV on channel 0, and channel 1's AUDV, AUDF and AUDC writes landing a cycle later each frame across the line, and RSYNC landing there"
check = "frame"
frames = 108
audio_samples = 55000
stella = "Four bands (brown, purple, violet, blue) with a short black line where RSYNC cuts the last band's first line; the sound changes every frame"

[[rom]]
id = "tia_paddles"
source = "a2600-carts"
path = "tia_paddles.bin"
sha256 = "77fbd49a35138b2e2e4d9e593732cff1b24f2fca0a1c22515ec1c903494e5b77"
needs = "cpu, tia, paddles"
covers = "The paddles' inputs (INPT0-3) and their dump (VBLANK bit 7): each input's capacitor charging from a dump of 27 to 58 cycles, read the 2 cycles before Stella's crossing and the 2 after; and reads before and in the dump"
check = "frame"
frames = 134
paddles = [128, 128, 128, 128]
stella = "Bytes 0-15 each 00110011 (each group of 4 reads: 0, 0, 1, 1); bytes 16-31 all 1s but the first frame's (charged before the dump, 0 in it)"
